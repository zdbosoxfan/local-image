# Local Image 2: PhotoCraft's editor and LightCraft's photo pipeline, vendored unmodified-as-possible
# under vendor/ (git subtree; see docs/UPSTREAM.md), plus Local Image's own AI crates.
[workspace]
resolver = "3"
members = ["crates/*"]
# The vendored projects are their own Cargo workspaces; our crates use them as path dependencies.
exclude = ["vendor"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/zdbosoxfan/local-image"

[workspace.dependencies]
li-ai = { path = "crates/li-ai" }

anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
rayon = "1"
log = "0.4"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3", features = ["json"] }
tungstenite = "0.27"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
dirs = "6"
tiny_http = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"

# Pixel code is unusably slow unoptimised; these match PhotoCraft's and LightCraft's own profiles.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
