name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2
  CRAFT_FONTS_REQUIRED: 1
  CRAFT_FONTS_DIR: ${{ github.workspace }}/.cache/craft-fonts

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check out the verified release font input
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: .cache/craft-fonts
          persist-credentials: false

      - name: Install Linux system dependencies and rendering oracles
        if: runner.os == 'Linux'
        run: |
          # The distro package may predate the SVG oracle's required --app-id-tag.
          # https://wiki.inkscape.org/wiki/Installing_Inkscape
          sudo add-apt-repository -y ppa:inkscape.dev/stable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers inkscape poppler-utils
          inkscape --app-id-tag=liCIVersion --version
          pdftoppm -v

      - name: Install Windows rendering oracles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install inkscape --version=1.4.4 --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Inkscape install failed: $LASTEXITCODE" }
          choco install poppler --version=26.7.0 --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Poppler install failed: $LASTEXITCODE" }
          $inkscape = Join-Path $env:ProgramFiles 'Inkscape/bin/inkscape.com'
          if (-not (Test-Path -LiteralPath $inkscape -PathType Leaf)) { throw 'Inkscape console executable was not installed' }
          "LOCAL_IMAGE_INKSCAPE=$inkscape" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $poppler = Get-ChildItem (Join-Path $env:ChocolateyInstall 'lib/poppler/tools') -Filter pdftoppm.exe -File -Recurse | Select-Object -First 1
          if (-not $poppler) { throw 'Poppler pdftoppm executable was not installed' }
          $poppler.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $inkscape --app-id-tag=liCIVersion --version
          if ($LASTEXITCODE -ne 0) { throw 'Inkscape command-line verification failed' }
          & $poppler.FullName -v
          if ($LASTEXITCODE -ne 0) { throw 'Poppler command-line verification failed' }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
