name: Linux installable release

on:
  push:
    branches: [fix/linux-editor-performance-cutout-batch]
    paths: [.github/linux-release.json]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version declared in .github/linux-release.json
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements-linux-build.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Read release version
        id: release
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          release = json.loads(Path('.github/linux-release.json').read_text())
          version = release['version']
          if not re.fullmatch(r'[0-9][A-Za-z0-9.+~-]*', version):
              raise SystemExit('Invalid release version')
          if release['tag'] != 'v' + version or not release['prerelease']:
              raise SystemExit('Linux previews require a matching tag and prerelease flag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('version', 'tag', 'title'):
                  value = release[key]
                  if '\n' in value or '\r' in value:
                      raise SystemExit('Release metadata must fit on one line')
                  output.write(f'{key}={value}\n')
          PY
      - name: Install desktop and packaging libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils patchelf gcc g++ libnss3 libnspr4 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb1 libxcb-util1 libxcb-shape0 \
            libdbus-1-3 libegl1 libgl1 libopengl0 libasound2t64 libfontconfig1 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxtst6 libxi6 \
            libcups2t64 libdrm2 libgbm1 libgtk-3-0t64 libpulse0 xvfb xauth fonts-dejavu-core \
            desktop-file-utils
          python -m pip install -r packaging/requirements-linux-build.txt
      - name: Validate React UI and build bundled assets
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          node --experimental-strip-types --test --test-isolation=none tests/*.test.ts src/features/*/*.test.mjs src/editor/*.test.mjs
          npm run build
      - name: Validate backend, desktop protocol and installer
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Freeze desktop and backend, build archive and Debian package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: bash packaging/Build-Linux.sh --python "$(command -v python)" --version "$RELEASE_VERSION" --output dist/linux
      - name: Check installed app with isolated user data
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python packaging/linux/smoke_install.py --package "dist/linux/Local-Image-$RELEASE_VERSION-linux-x86_64"
          xvfb-run -a env QT_QPA_PLATFORM=xcb python packaging/linux/smoke_install.py --package "dist/linux/Local-Image-$RELEASE_VERSION-linux-x86_64"
          desktop-file-validate "dist/linux/Local-Image-$RELEASE_VERSION-linux-x86_64/local-image.desktop"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb
            dist/linux/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-installers
          path: release-assets
      - name: Publish verified Linux preview installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TITLE: ${{ needs.build.outputs.title }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS
          cd ..
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >tag-ref.json 2>tag-ref.error; then
            echo "The release tag already exists. Choose a new version before publishing."
            exit 1
          elif ! grep -q '(HTTP 404)' tag-ref.error; then
            cat tag-ref.error
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" --prerelease --title "$RELEASE_TITLE" \
            --notes-file packaging/linux/RELEASE-NOTES.md \
            release-assets/*.tar.gz release-assets/*.deb release-assets/SHA256SUMS
