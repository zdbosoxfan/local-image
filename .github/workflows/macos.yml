name: macOS Apple Silicon
on:
  workflow_dispatch:
    inputs:
      metal_runner:
        description: 'Run full hardware acceptance on a trusted self-hosted Mac labelled metal'
        type: boolean
        default: false
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 4
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0
  RUST_TEST_THREADS: 1
  MACOSX_DEPLOYMENT_TARGET: '13.0'
  CRAFT_FONTS_REQUIRED: 1
  CRAFT_FONTS_DIR: ${{ github.workspace }}/.cache/craft-fonts
jobs:
  native:
    # Standard hosted macOS VMs are build/portable-test hosts. GPU acceptance needs a
    # real Metal-capable host; never silently treat an adapter skip as acceleration proof.
    runs-on: ${{ inputs.metal_runner && fromJSON('["self-hosted", "macOS", "ARM64", "metal"]') || 'macos-15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify native Apple Silicon host
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: .cache/craft-fonts
          persist-credentials: false
      # With a SHA ref the action cannot infer the toolchain from the ref name: pass it.
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install independent rendering oracles
        run: brew install inkscape poppler
      - name: Fetch the licensed Japanese text-layout fixture
        if: ${{ inputs.metal_runner }}
        run: |
          cjk_fixture="$RUNNER_TEMP/NotoSansCJKjp-Regular.otf"
          curl --fail --location --retry 2 https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf --output "$cjk_fixture"
          echo "68a3fc98800b2a27b371f2fb79991daf3633bd89309d4ffaa6946fd587f375b5  $cjk_fixture" | shasum -a 256 --check
          echo "LOCAL_IMAGE_PATH_TEXT_CJK_FONT=$cjk_fixture" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Fetch all platforms for the offline dependency audit
        run: cargo fetch --locked
      - name: Test portable macOS integrations
        if: ${{ !inputs.metal_runner }}
        run: cargo test --locked -p li-ai -p li-seg -p lightcraft-sysmem -p xtask
      - name: Compile every macOS integration and feature
        run: cargo check --workspace --all-targets --locked --features local-image/heif,local-image-cli/heif
      - name: Test full workspace on hardware
        if: ${{ inputs.metal_runner }}
        run: cargo test --workspace --locked --features local-image/heif,local-image-cli/heif
      - name: Require Metal compositor parity
        if: ${{ inputs.metal_runner }}
        env:
          WGPU_BACKEND: metal
          LOCAL_IMAGE_REQUIRE_GPU: 1
        run: cargo test --locked -p photocraft-gpu --test gpu --test vector_geometry
      - name: Require Metal Develop numerical conformance
        if: ${{ inputs.metal_runner }}
        env:
          LC_REQUIRE_GPU: 1
        run: cargo test --locked -p lightcraft-gpu --lib ds_finding_native_haze_selection_matches_sorted_quantile -- --ignored --nocapture
      - name: Strict lint
        run: cargo clippy --workspace --all-targets --locked --features local-image/heif,local-image-cli/heif -- -D warnings
      - name: Build Apple Silicon installer
        run: cargo +1.98.1 xtask package macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-image-macos-arm64
          path: dist/release/*macos-arm64.pkg*
          if-no-files-found: error
