<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Image</title>
<link rel="icon" type="image/png" href="__APP_ICON__">
__FRONTEND_HEAD__
</head>
<body>
<div id="react-app-root" data-react-owned="true"></div>
<main id="editor-layout" class="li-editor-layout">
  <aside id="tools-root" data-react-owned="true" aria-label="Tools"></aside>
  <aside id="assets-root" data-react-owned="true" hidden></aside>
  <section id="canvas-region" class="li-canvas-region">
    <div id="document-root" data-react-owned="true"></div>
    <div class="viewport" id="viewport" tabindex="0" aria-label="Photo canvas. Scroll to zoom. Hold Space and drag to pan.">
      <div class="stage" id="stage" hidden><img class="photo-image" id="photo-image" alt="" draggable="false"><canvas id="photo"></canvas><div class="layer-stack" id="layer-stack"></div><canvas class="overlay" id="selection"></canvas><canvas class="draft" id="draft"></canvas></div>
      <div id="progress-root" data-react-owned="true"></div>
      <div id="brush-cursor" class="brush-cursor" hidden></div>
      <div id="empty-root" data-react-owned="true"></div>
      <div id="drop-notice" class="drop-notice" hidden>Drop to open</div>
    </div>
    <section id="filmstrip-root" data-react-owned="true"></section>
  </section>
  <aside id="inspector-root" data-react-owned="true" aria-label="Editing panels"></aside>
  <section id="react-generation-root" data-react-owned="true" hidden></section>
</main>
<footer id="status-root" data-react-owned="true"></footer>
<script nonce="__NONCE__">window.__LOCAL_IMAGE_BOOTSTRAP__=__BOOTSTRAP__;</script>
__FRONTEND_MODULE__
</body>
</html>
