# cargo-deny policy for Local Image 2 (GPL-3.0-or-later). Run: `cargo deny check`.
# CI runs this in .github/workflows/ci.yml; Dependabot keeps the lockfile moving.

[graph]
# The shipped platforms. Dependencies that only exist for other targets are not audited.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
# RustSec advisory database (fetched by cargo-deny).
version = 2
yanked = "deny"
# Baseline exceptions, each narrowly scoped. They record known findings so CI starts green and then
# catches NEW advisories; none is a claim that the finding is harmless. Remove an entry as soon as
# the dependency can move (cargo-deny warns about an ignore that no longer matches anything).
ignore = [
    # --- rustls-webpki 0.102.8 (old webpki pinned by rustls-rustcrypto 0.0.2-alpha). Fixed in
    # >=0.103.10, which that alpha crate does not allow; needs a different rustls crypto provider.
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102.8 CRL distribution point matching; CRL checking is not used; move off rustls-rustcrypto" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102.8 URI name constraints; move off rustls-rustcrypto" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102.8 wildcard name constraints; move off rustls-rustcrypto" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102.8 CRL parsing panic; CRL checking is not used; move off rustls-rustcrypto" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102.8 emSign intermediates; rustls-rustcrypto uses it only for alg_id constants, chains are built by rustls 0.23 on rustls-webpki >=0.103.16; move off rustls-rustcrypto" },
    # --- rsa 0.9.10 via rustls-rustcrypto (Marvin timing attack on private-key operations). No
    # upstream fix exists; li-ai is a TLS client and holds no RSA private key.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack; no upstream fix; only reachable through rustls-rustcrypto client-side verification" },
    # crypto-bigint 0.5.5 via elliptic-curve 0.13: the latest rustls-rustcrypto still pins
    # p256/p384 0.13. Fixed crypto-bigint >=0.7.6 requires their newer, incompatible APIs.
    { id = "RUSTSEC-2026-0387", allow = ["elliptic-curve@0.13.8"], reason = "RUSTSEC-2026-0387 affects TLS ECDHE secrets; rustls-rustcrypto 0.0.2-alpha pins p256/p384 ^0.13 and crypto-bigint ^0.5; fixed >=0.7.6 is incompatible. Remove when a maintained pure-Rust TLS provider permits the patched dependency" },
    # --- Unmaintained crates (informational; no known vulnerability).
    { id = "RUSTSEC-2024-0436", reason = "paste is a compile-time proc macro (pulp -> exr); no runtime code" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 unmaintained, via ab_glyph; replace with a maintained font parser" },
    # zvariant, zvariant_derive and zbus_names were folded into zbus 6 rather than abandoned. They
    # come only from eframe -> accesskit_unix (Linux AT-SPI accessibility); clears when eframe moves
    # to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; via eframe/accesskit_unix; no compatible upgrade yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; via eframe/accesskit_unix; no compatible upgrade yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; via eframe/accesskit_unix; no compatible upgrade yet" },
    # --- zip 7.2.0 extraction advisories, fixed in >=9.0.0, which candle-core =0.9.2 (zip ^7.2.0)
    # does not allow. candle only reads named entries; the one extraction (xtask Windows signing,
    # Microsoft's NuGet package) uses xtask's extract_plain_files, which confines paths to the
    # destination and never creates symlinks or applies Unix permission bits.
    { id = "RUSTSEC-2026-0367", reason = "zip <9 extract() SUID/SGID preservation; ZipArchive::extract is not called (xtask uses extract_plain_files)" },
    { id = "RUSTSEC-2026-0368", reason = "zip <9 extract() permissions through symlinks; ZipArchive::extract is not called and symlink entries are skipped" },
    { id = "RUSTSEC-2026-0369", reason = "zip <9 extract() symlink targets outside destination; ZipArchive::extract is not called and symlink entries are skipped" },
    # --- Yanked release. Not a vulnerability. Every zip 7.x is yanked and candle-core 0.9.2 through
    # 0.10.2 require ^7.2.0; candle-core 0.11 needs zip ^8.6.0 whose only release (8.6.0) is also
    # yanked. Resolved by a future candle-core release that depends on zip 9.
    { crate = "zip@7.2.0", reason = "yanked; required by candle-core =0.9.2 (zip ^7.2.0; all of 7.x and 8.6.0 are yanked); needs a candle-core release on zip 9" },
]

[licenses]
version = 2
# Everything below is GPL-3.0-or-later compatible (permissive, or weak copyleft that may be
# combined with GPL-3.0). Add a license here only after checking that it is.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
    "BSL-1.0",             # clipboard-win, error-code (Boost: permissive)
    "IJG",                 # jpeg-encoder, alongside MIT OR Apache-2.0 (permissive, GPL-compatible)
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA root data)
]
confidence-threshold = 0.9
exceptions = [
    # rawler (dnglab) is LGPL-2.1-only. LGPL-2.1 section 3 lets us elect the ordinary GNU GPL for
    # it, which licenses/rawler-NOTICE.md records; the crate is linked unmodified.
    { crate = "rawler", allow = ["LGPL-2.1"] },
    # egui's bundled default fonts: font data embedded unmodified; OFL-1.1 and the Ubuntu Font
    # Licence permit bundling in GPL software.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
