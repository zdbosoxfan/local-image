[package]
name = "lightcraft-segment"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "LightCraft segmentation: SAM 3 (Segment Anything with Concepts) inference in pure Rust (L3)"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# the model runs natively only (the web build has no AI masks)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
# model downloads go through the app's one verified downloader (fetch::mirror)
li-ai = { workspace = true }
# the shared cancellation type the downloader reports
lightcraft-sysmem = { workspace = true }
# the shared CLIP BPE tokenizer (li_seg::bpe) for text prompts
li-seg = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[dev-dependencies]
# the mirror tests check the served bytes against their SHA-256
sha2 = { workspace = true }
