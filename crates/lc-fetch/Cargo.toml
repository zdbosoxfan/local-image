[package]
name = "lightcraft-fetch"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "LightCraft model downloads: an ordered mirror list over li-ai's verified downloader (L0)"

[lints]
workspace = true

# downloads run natively only (the web build fetches no models); every byte goes through the
# app's one downloader (li-ai::download: host allow-list, mandatory size + SHA-256)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
li-ai = { workspace = true }
log = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
