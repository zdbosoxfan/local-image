[package]
name = "lightcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
li-commands.workspace = true
# The shared crash-safe file writer (atomic replace, new-file publication, fault injection).
li-fs.workspace = true
same-file = "1.0.6"
li-raster = { path = "../li-raster" }
# Existing locked pure-Rust PDF stack; no new crate versions.
krilla = { workspace = true }
# Reuse the editor text layout/shaping engine for multilingual metadata captions.
photocraft-text = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-geom = { workspace = true }
li-color = { workspace = true }
lightcraft-geom = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-scenes = { workspace = true }
lightcraft-pipeline = { workspace = true }
lightcraft-gpu = { workspace = true }
lightcraft-catalog = { workspace = true }
web-time = { workspace = true }
uuid = { workspace = true }
lightcraft-preview = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raw = { workspace = true }
li-seg = { workspace = true }
# Thread priority classes and the shared background pool (smart sort, previews, AI jobs).
lightcraft-sysmem = { workspace = true }
lensfun = { workspace = true }
lightcraft-meta = { workspace = true }
miniz_oxide = { workspace = true }
lightcraft-merge = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
lightcraft-segment = { workspace = true, optional = true }
# Content-aware healing in Develop: Compositing's Spot Healing (PatchMatch completion + Poisson
# seamless blending). Pure Rust; the photocraft-* crates never depend on lightcraft-*.
photocraft-algo = { workspace = true }
photocraft-raster = { workspace = true }

[features]
# AI masks with SAM 3 (Object / Describe). Off by owner decision: no default build enables it
# (`local-image --features sam` opts in; the crate stays buildable).
sam = ["dep:lightcraft-segment"]

[dev-dependencies]
libc = { workspace = true }
li-testkit = { workspace = true }
