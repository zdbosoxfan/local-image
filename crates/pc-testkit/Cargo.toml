[package]
name = "photocraft-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
image.workspace = true
kurbo = "=0.13.1"
photocraft-doc.workspace = true
photocraft-vector.workspace = true
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# In-process resident memory for the benchmarks (`perf`; MIT OR Apache-2.0).
memory-stats = "1.2"

[dev-dependencies]
resvg = { version = "=0.45.1", default-features = false }

# Already locked, pure Rust; exact external-oracle path numbers before usvg f32 storage.
svgtypes = "=0.15.3"
