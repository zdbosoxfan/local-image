[package]
name = "li-fs"
description = "Shared atomic and durable file publication for Local Image"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Retain the existing public cancellation type; no new registry dependencies.
photocraft-raster.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Already locked and in the build tree: safe renameat2/renameatx_np wrappers.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }
