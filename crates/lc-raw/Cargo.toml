[package]
name = "lightcraft-raw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft RAW decoding, demosaicing and DNG colour model (L1)"

[lints]
workspace = true

[dependencies]
lightcraft-tiff = { workspace = true }
lightcraft-meta = { workspace = true }
li-color = { workspace = true }
li-raster = { path = "../li-raster" }
lightcraft-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true, features = ["serialize"] }
thiserror = { workspace = true }
rayon = { workspace = true }
miniz_oxide = { workspace = true }
half = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }

# Measured per-format routing selects native or rawler first, with the other as fallback.
# Keep optional rawdb (HTTP/TLS) and clap features disabled.
rawler = { version = "=0.8.0", default-features = false }

[dev-dependencies]
jpeg-encoder = { workspace = true }
proptest = { workspace = true }

[features]
testgen = []
