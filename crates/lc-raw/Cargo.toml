[package]
name = "lightcraft-raw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft RAW decoding, demosaicing and DNG colour model (L1)"

[lints]
workspace = true

[dependencies]
lightcraft-tiff = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-geom = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
miniz_oxide = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }

# Native decoders stay first; rawler handles every Unsupported result.
# Keep optional rawdb (HTTP/TLS) and clap features disabled.
rawler = { version = "=0.8.0", default-features = false }

[dev-dependencies]
jpeg-encoder = { workspace = true }
proptest = { workspace = true }
