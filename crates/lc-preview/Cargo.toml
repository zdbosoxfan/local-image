[package]
name = "lightcraft-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft preview cache: content identity and hashing, memory LRU, disk thumbnail cache, prioritized job pool (L3)"

[lints]
workspace = true

[dependencies]
li-fs.workspace = true
li-raster = { path = "../li-raster" }
siphasher = { workspace = true }
# content identity: the same BLAKE3 (pure Rust, as the editor uses it) for catalog and linked sources
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
jpeg-encoder = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
log = { workspace = true }
